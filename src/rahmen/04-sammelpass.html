<style>
  .r-pass .kopf { display: flex; align-items: center; gap: 4mm; border-bottom: 1.2mm solid var(--akzent); padding-bottom: 2.5mm; margin-bottom: 3mm; }
  .r-pass .kopf h1 { font-family: var(--text); font-weight: 1000; font-size: 26pt; margin: 0; flex: 1; }
  .r-pass .kopf .name { font-family: var(--kind); font-size: 15pt; }
  .r-pass .erkl { font-family: var(--kind); font-size: 14pt; margin: 0 0 3mm 0; line-height: 1.3; }
  .r-pass .gitter { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(5, 1fr); gap: 2.5mm; flex: 1; min-height: 0; }
  .r-pass .f {
    border: 0.5mm solid var(--linie);
    border-radius: 3.5mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 1.6mm 1.5mm 1.8mm 1.5mm;
    position: relative;
    break-inside: avoid;
  }
  .r-pass .f[data-block="B"] { border-color: var(--block-b); }
  .r-pass .f[data-block="C"] { border-color: var(--block-c); }
  .r-pass .f[data-block="D"] { border-color: var(--block-d); }
  .r-pass .f[data-block="A"] { border-color: var(--block-a); }
  .r-pass .f .t { hyphens: manual; display: flex; align-items: center; gap: 1.5mm; font-family: var(--text); font-weight: 800; font-size: 9.5pt; line-height: 1.1; text-align: left; width: 100%; min-height: 9mm; }
  .r-pass .f .t .nr { flex: none; width: 6.5mm; height: 6.5mm; border-radius: 50%; background: var(--akzent); color: white; display: flex; align-items: center; justify-content: center; font-weight: 1000; font-size: 9.5pt; }
  .r-pass .f .stempel { width: 21mm; height: 21mm; border-radius: 50%; border: 0.5mm dashed var(--grau); }
  .r-pass .f .sterne { display: flex; gap: 0.5mm; line-height: 0; }
  .r-pass .f .urk { position: absolute; top: 9.5mm; right: 1.5mm; line-height: 0; }
  .r-pass .legende { display: flex; gap: 6mm; justify-content: center; font-family: var(--text); font-size: 8.5pt; color: var(--grau); margin-top: 2mm; }
  .r-pass .legende span { display: inline-flex; align-items: center; gap: 1.5mm; }
  .r-pass .legende i { display: inline-block; width: 3.5mm; height: 3.5mm; border-radius: 1mm; }
</style>

<section class="seite r-pass" id="sammelpass" data-toc="Mein Sammelpass" data-block="A">
  <div class="kopf">
    <m-bild name="krone" gr="13"></m-bild>
    <h1>Mein Sammelpass</h1>
    <span class="name">von Mathilda</span>
  </div>
  <p class="erkl">Nach jeder Einheit: Stempel oder Sticker in den Kreis.<br>Mal die Sterne an: Wie hat es dir gefallen?</p>
  <div class="gitter" id="r-pass-gitter"></div>
  <div class="legende">
    <span><i style="background: var(--block-a)"></i>Zahlen bis 20</span>
    <span><i style="background: var(--block-b)"></i>Zahlen bis 100</span>
    <span><i style="background: var(--block-c)"></i>Mal & Geteilt</span>
    <span><i style="background: var(--block-d)"></i>Knobeln & Zaubern</span>
    <span><m-bild name="medaille" gr="4.5"></m-bild>Urkunde!</span>
  </div>
  <div class="fuss"><span>Mathildas Rechen-Werkstatt</span><span class="seitenzahl" data-ref="sammelpass"></span><span>Sammelpass</span></div>
</section>

<script>
  // Felder des Sammelpasses (Titel laut plan/lehrplan.md; können sich nach der Rückmeldung ändern)
  (function () {
    const einheiten = [
      'Blitzblick', 'Zehnerfreunde', 'Doppelt & halb', 'Über die Zehn springen', 'Zurück über die Zehn',
      'Zahlenfamilien & Detektiv', 'Bündeln wie ein Profi', 'Die Hundertertafel', 'Große Sprünge', 'Über die Zehner springen',
      'Untereinander rechnen: Plus', 'Untereinander rechnen: Minus', 'Hüpfen in Sprüngen', 'Punktefelder & Malreihen', 'Gerecht teilen',
      'Zahlenmauern', 'Magische Quadrate', 'Formen & Tangram', 'Zahlen-Zaubertricks', 'Das große Rechen-Fest',
    ];
    const block = (n) => (n <= 6 ? 'A' : n <= 12 ? 'B' : n <= 15 ? 'C' : 'D');
    const g = document.getElementById('r-pass-gitter');
    g.innerHTML = einheiten.map((t, i) => {
      const n = i + 1;
      return '<div class="f" data-block="' + block(n) + '"><div class="t"><span class="nr">' + n + '</span><span>' + t.replace('&', '&amp;') + '</span></div>' +
        (n === 10 || n === 20 ? '<span class="urk"><m-bild name="medaille" gr="7"></m-bild></span>' : '') +
        '<div class="stempel"></div><div class="sterne"><m-stern gr="8.5"></m-stern><m-stern gr="8.5"></m-stern><m-stern gr="8.5"></m-stern></div></div>';
    }).join('');
  })();
</script>
